services:
  calendar-puzzle:
    image: calendar-puzzle
    build: .
    ports:
      - "${PORT}:3001"
    environment:
      - TZ=Asia/Jerusalem
      - NODE_ENV=production
      # Optional. Leave unset to trust loopback and private ranges. That default
      # covers both tunnels, on the Docker host and on the Proxmox guest.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - DATABASE_URL=postgresql://puzzle:${POSTGRES_PASSWORD}@postgres:5432/puzzle
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - HALL_OF_FAME_PEPPER=${HALL_OF_FAME_PEPPER}
    volumes:
      - ./secret-key:/usr/app/secret-key:ro
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:18.1-alpine3.23
    environment:
      - POSTGRES_USER=puzzle
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=puzzle
    volumes:
      - calendar_puzzle_postgres_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  calendar_puzzle_postgres_data:
