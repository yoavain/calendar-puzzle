<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar Puzzle Promo</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
"use strict";
// ============================================================================
// Calendar Puzzle - 15s promo. Deterministic: renderFrame(t) draws time t.
// Built and rendered by scripts/generate-promo.ts; open the built page with ?play or ?t=<sec> to preview.
// ============================================================================
const ASSETS = { cal: "__CAL__", puz: "__PUZ__" };
const SOLUTION = __SOL__;

const W = 1920, H = 1080, DUR = 15;
const view = document.getElementById("c");
const out = view.getContext("2d");
const scratch = document.createElement("canvas");
scratch.width = W; scratch.height = H;
const ctx = scratch.getContext("2d");

// ---------------------------------------------------------------- math/easing
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
    inQuad: x => x * x,
    outQuad: x => 1 - (1 - x) * (1 - x),
    inCubic: x => x * x * x,
    outCubic: x => 1 - Math.pow(1 - x, 3),
    inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
    outQuart: x => 1 - Math.pow(1 - x, 4),
    inOutQuart: x => x < .5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2,
    outQuint: x => 1 - Math.pow(1 - x, 5),
    outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
    inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
    inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
    outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
    inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x
};
// Damped oscillation impulse (0 at t<=0).
const ring = (t, f = 5, d = 8) => t <= 0 ? 0 : Math.sin(t * f * TAU) * Math.exp(-t * d);
const lerpAngle = (a, b, t) => a + (b - a) * t;

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

// Catmull-Rom keyframe track -> smooth, non-stopping camera motion.
function track(keys, t, prop) {
    if (t <= keys[0].t) return keys[0][prop];
    const n = keys.length;
    if (t >= keys[n - 1].t) return keys[n - 1][prop];
    let i = 0;
    while (t > keys[i + 1].t) i++;
    const k0 = keys[Math.max(0, i - 1)], k1 = keys[i], k2 = keys[i + 1], k3 = keys[Math.min(n - 1, i + 2)];
    const u = (t - k1.t) / (k2.t - k1.t);
    const dt = k2.t - k1.t;
    const m1 = (k2[prop] - k0[prop]) / Math.max(1e-6, k2.t - k0.t) * dt;
    const m2 = (k3[prop] - k1[prop]) / Math.max(1e-6, k3.t - k1.t) * dt;
    const u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * k1[prop] + (u3 - 2 * u2 + u) * m1 + (-2 * u3 + 3 * u2) * k2[prop] + (u3 - u2) * m2;
}

// ---------------------------------------------------------------- 3D
const rx = a => { const c = Math.cos(a), s = Math.sin(a); return [1, 0, 0, 0, c, -s, 0, s, c]; };
const ry = a => { const c = Math.cos(a), s = Math.sin(a); return [c, 0, s, 0, 1, 0, -s, 0, c]; };
const rz = a => { const c = Math.cos(a), s = Math.sin(a); return [c, -s, 0, s, c, 0, 0, 0, 1]; };
const mm = (A, B) => {
    const r = new Array(9);
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
        r[i * 3 + j] = A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j];
    return r;
};
const mv = (M, v) => [M[0] * v[0] + M[1] * v[1] + M[2] * v[2], M[3] * v[0] + M[4] * v[1] + M[5] * v[2], M[6] * v[0] + M[7] * v[1] + M[8] * v[2]];
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const vlerp = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

let CAM = null;
function setCamera(c) {
    const V = mm(rz(c.roll), mm(ry(c.yaw), mm(rx(-c.pitch), rz(c.spin))));
    CAM = { ...c, V };
}
function toView(p) { return mv(CAM.V, sub(p, CAM.T)); }
function projV(q) {
    const d = CAM.dist - q[2];
    return { x: W / 2 + CAM.sx + CAM.f * q[0] / d, y: H / 2 + CAM.sy - CAM.f * q[1] / d, d };
}
const proj = p => projV(toView(p));
const EYE = () => [0, 0, CAM.dist];

// World light (board space). Rest-top of a flat block renders at exactly its base colour.
const LIGHT = norm([-0.45, 0.25, 1]);
const AMB = 0.34, DIF = 0.66;
const REST_LIGHT = AMB + DIF * LIGHT[2];
const shadeF = n => (AMB + DIF * Math.max(0, dot(n, LIGHT))) / REST_LIGHT;

// ---------------------------------------------------------------- colours
const PC = { 1: "#E07A5F", 2: "#3D9970", 3: "#6B4423", 4: "#8B5CF6", 5: "#DB5B80", 6: "#E8AA14", 7: "#8DA547", 8: "#4169E1" };
const YEL = "#ffeb3b";
const hex2rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const scaleC = (c, f) => c.map(v => clamp(v * f, 0, 255));
const mixC = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const WHITE = [255, 255, 255];
const PRGB = {}; for (const k in PC) PRGB[k] = hex2rgb(PC[k]);
const YRGB = hex2rgb(YEL);

// ---------------------------------------------------------------- game data
const SHAPES = {
    1: [[1, 0], [1, 0], [1, 1], [1, 0]], 2: [[1, 1, 1], [1, 0, 1]], 3: [[1, 0, 0], [1, 1, 1], [0, 0, 1]],
    4: [[0, 1], [0, 1], [1, 1], [1, 0]], 5: [[0, 1], [1, 1], [1, 1]], 6: [[0, 0, 1], [0, 0, 1], [1, 1, 1]],
    7: [[1, 1], [1, 1], [1, 1]], 8: [[1, 0], [1, 0], [1, 0], [1, 1]]
};
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const DIM = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const DAYS_W = [7, 7, 7, 7, 3];
const DATE = __DATE__;   // { month: 0-11, day: 1-31 }, filled in by scripts/generate-promo.ts
const cellW = (cx, cy) => [cx - 3, 3 - cy];     // board cell -> world XY (cell centre)
const monthCell = m => [m % 6, Math.floor(m / 6)];
const dayCell = d => [(d - 1) % 7, 2 + Math.floor((d - 1) / 7)];

const TILES = [];
for (let cy = 0; cy < 7; cy++) for (let cx = 0; cx < 7; cx++) {
    const ok = cy < 2 ? cx < 6 : cx < DAYS_W[cy - 2];
    if (!ok) continue;
    const label = cy < 2 ? MONTHS[cy * 6 + cx] : String((cy - 2) * 7 + cx + 1);
    TILES.push({ cx, cy, label, month: cy < 2 });
}

const PIECE_T = 0.4;   // block thickness (cell = 1)
const TILE_T = 0.06;
const REST_Z = TILE_T + PIECE_T / 2;

// Piece models: base shape centred on its centroid, and the solved pose.
const PIECES = {};
for (const s of SOLUTION) {
    const base = [];
    SHAPES[s.id].forEach((row, y) => row.forEach((v, x) => v && base.push([x, -y])));
    const c0 = base.reduce((a, p) => [a[0] + p[0] / base.length, a[1] + p[1] / base.length], [0, 0]);
    const local = base.map(p => [p[0] - c0[0], p[1] - c0[1]]);
    const tw = s.cells.map(([cx, cy]) => cellW(cx, cy));
    const tc = tw.reduce((a, p) => [a[0] + p[0] / tw.length, a[1] + p[1] / tw.length], [0, 0]);
    // Game order: rotate clockwise, then flip H, then flip V.
    let az = -s.rotation * PI / 180;
    while (az <= -PI) az += TAU;
    const ay = s.flipH ? PI : 0, ax = s.flipV ? PI : 0;
    const M = mm(rx(ax), mm(ry(ay), rz(az)));
    for (const l of local) {        // sanity check the orientation maths
        const p = mv(M, [l[0], l[1], 0]);
        const hit = tw.some(q => Math.abs(q[0] - (p[0] + tc[0])) < 1e-6 && Math.abs(q[1] - (p[1] + tc[1])) < 1e-6);
        if (!hit) console.error("orientation mismatch for piece", s.id);
    }
    PIECES[s.id] = { id: s.id, local, target: [tc[0], tc[1], REST_Z], az, ay, ax, sol: s, rgb: PRGB[s.id] };
}

// ---------------------------------------------------------------- timeline (120 BPM, beat = .5s)
const T = {
    boardIn: 2.0,
    tilesIn: 2.2,
    markersIn: 3.5,
    rouletteA: 3.6, rouletteB: 5.0,
    solveOrder: [1, 4, 2, 5, 6, 8, 7, 3],
    firstLand: 5.5, landStep: 0.5,
    solved: 9.5,
    endCam: 10.0,
    calIn: 10.0, puzIn: 10.5, letterStep: 0.0625,
    tagIn: 11.4, ctaIn: 11.9
};
const LAND = {};
T.solveOrder.forEach((id, k) => LAND[id] = T.firstLand + k * T.landStep);
const DATE_STEPS = (() => { let n = 0; for (let m = 0; m < DATE.month; m++) n += DIM[m]; return n + DATE.day - 1; })();
function dateAt(k) {
    let m = 0; while (k >= DIM[m]) { k -= DIM[m]; m++; }
    return { m, d: k + 1 };
}

// ---------------------------------------------------------------- camera keys
const CAM_KEYS = [
    { t: 0.0, pitch: 0.00, spin: 0.00, yaw: -0.16, roll: -0.03, dist: 31, sx: 0, sy: 70 },
    { t: 1.9, pitch: 0.10, spin: 0.00, yaw: 0.10, roll: 0.00, dist: 28, sx: 0, sy: 70 },
    { t: 3.0, pitch: 0.86, spin: -0.26, yaw: 0.00, roll: 0.00, dist: 27, sx: 0, sy: 95 },
    { t: 4.9, pitch: 0.74, spin: -0.10, yaw: 0.00, roll: 0.00, dist: 22.5, sx: 0, sy: 90 },
    { t: 5.6, pitch: 0.68, spin: -0.07, yaw: 0.00, roll: 0.00, dist: 21.5, sx: 190, sy: 45 },
    { t: 9.2, pitch: 0.54, spin: 0.22, yaw: 0.00, roll: 0.00, dist: 19.0, sx: 200, sy: 45 },
    { t: 10.3, pitch: 0.64, spin: -0.02, yaw: -0.06, roll: 0.00, dist: 21.5, sx: 400, sy: 50 },
    { t: 11.6, pitch: 0.72, spin: -0.20, yaw: -0.10, roll: 0.00, dist: 22.5, sx: 440, sy: 40 },
    { t: 15.0, pitch: 0.76, spin: -0.26, yaw: -0.12, roll: 0.00, dist: 23.0, sx: 450, sy: 40 }
];
function cameraAt(t) {
    const c = {};
    for (const p of ["pitch", "spin", "yaw", "roll", "dist", "sx", "sy"]) c[p] = track(CAM_KEYS, t, p);
    c.f = 1400; c.T = [0, 0, 0];
    // impact shake
    let sh = 0;
    for (const id in LAND) sh += ring(t - LAND[id], 11, 14) * 5;
    sh += ring(t - T.rouletteB, 11, 12) * 9 + ring(t - T.boardIn, 10, 12) * 8 + ring(t - T.solved, 9, 8) * 10;
    c.sy += sh;
    return c;
}

// ---------------------------------------------------------------- board motion
function boardDz(t) {
    let d = 0;
    for (const id in LAND) d -= 0.05 * Math.max(0, ring(t - LAND[id], 4, 10));
    d -= 0.10 * Math.max(0, ring(t - T.rouletteB, 4, 9));
    return d;
}
// Celebration ripple from board centre.
function waveLift(x, y, t) {
    const tt = t - T.solved;
    if (tt < 0 || tt > 1.6) return 0;
    const r = Math.hypot(x, y);
    const front = tt * 9;
    return 0.55 * Math.exp(-Math.pow(r - front, 2) / 1.4) * Math.exp(-tt * 1.4);
}
function sweepAt(x, y, t) {
    const u = seg(t, T.solved + 0.05, T.solved + 0.75);
    if (u <= 0 || u >= 1) return 0;
    const s = lerp(-9, 9, E.inOutCubic(u));
    return 0.55 * Math.exp(-Math.pow(x * 0.6 - y * 0.8 - s, 2) / 0.5);
}

// ---------------------------------------------------------------- piece choreography
const ROW_X = i => (i - 3.5) * 3.35;
const BURST_ORDER = [3, 4, 2, 5, 1, 6, 0, 7];
const ORBIT_ANG = [202.5, 247.5, 292.5, 337.5, 157.5, 112.5, 67.5, 22.5].map(d => d * PI / 180);
const ORBIT_R = 7.6;

function orbitPose(i, t) {
    const th = ORBIT_ANG[i] + 0.22 * (t - 2.0);
    return {
        pos: [Math.cos(th) * ORBIT_R, Math.sin(th) * ORBIT_R * 0.92, 1.9 + 0.25 * Math.sin(t * 1.7 + i * 1.3)],
        az: 0.18 * Math.sin(t * 0.9 + i), ax: 0.10 * Math.sin(t * 1.3 + i * 2), ay: 0.12 * Math.sin(t * 1.1 + i * 0.7)
    };
}
function rowPose(i, t) {
    const st = 0.04 + BURST_ORDER.indexOf(i) * 0.045;
    const u = seg(t, st, st + 0.85);
    const e = E.outExpo(u);
    const dir = i % 2 ? 1 : -1;
    const bob = 0.14 * Math.sin(t * 2.2 + i * 0.8);
    const pos = vlerp([0, -1.5, -16], [ROW_X(i), bob, 3], e);
    const wave = E.inOutCubic(seg(t, 1.0 + i * 0.0625, 1.0 + i * 0.0625 + 0.55));
    return {
        pos, visible: t >= st,
        az: (1 - e) * dir * TAU * 0.75, ax: (1 - e) * PI * 1.3, ay: wave * TAU,
        scale: lerp(0.2, 1, e)
    };
}

function pieceState(id, t) {
    const P = PIECES[id], i = id - 1;
    const land = LAND[id];
    const launch = land - 0.64, hoverT = land - 0.13;
    if (t < launch) {
        const r = rowPose(i, t);
        if (!r.visible) return null;
        const m = E.inOutCubic(seg(t, 2.0 + i * 0.05, 3.05 + i * 0.05));
        if (m <= 0) return { pos: r.pos, R: mm(rx(r.ax), mm(ry(r.ay), rz(r.az))), scale: r.scale, flash: 0 };
        const o = orbitPose(i, t);
        const pos = vlerp(r.pos, o.pos, m);
        pos[2] += Math.sin(PI * m) * 2.5;
        const R = mm(rx(lerp(r.ax, o.ax, m)), mm(ry(lerp(r.ay, o.ay, m)), rz(lerp(r.az, o.az, m))));
        return { pos, R, scale: 1, flash: 0 };
    }
    if (t < land) {
        const o = orbitPose(i, Math.min(t, launch + 0.25));
        const hover = [P.target[0], P.target[1], REST_Z + 1.3];
        const u = seg(t, launch, hoverT);
        const e = E.inOutQuart(u);
        let pos = vlerp(o.pos, hover, e);
        pos[2] += Math.sin(PI * e) * 3.0;
        const k = T.solveOrder.indexOf(id);
        const plain = !P.sol.rotation && !P.sol.flipH && !P.sol.flipV;
        const extra = plain ? (k % 2 ? TAU : -TAU) : 0;
        const er = E.inOutCubic(seg(t, launch + 0.04, hoverT));
        const R = mm(rx(lerp(o.ax, P.ax, er) + Math.sin(PI * er) * 0.35),
            mm(ry(lerp(o.ay, P.ay, er)), rz(lerp(o.az, P.az + extra, er))));
        if (t >= hoverT) {
            const v = seg(t, hoverT, land);
            pos = [P.target[0], P.target[1], lerp(REST_Z + 1.3, REST_Z, E.inCubic(v))];
        }
        return { pos, R, scale: 1, flash: 0 };
    }
    const dt = t - land;
    const sq = ring(dt, 4.5, 9);
    const R = mm(rx(P.ax), mm(ry(P.ay), rz(P.az)));
    return {
        pos: [P.target[0], P.target[1], REST_Z * (1 - 0.35 * sq) + boardDz(t)],
        R, scale: 1, sxy: 1 + 0.07 * sq, sz: 1 - 0.35 * sq,
        flash: Math.exp(-dt * 7) * 0.55, placed: true
    };
}

// ---------------------------------------------------------------- cube rendering
// Corner index bits: x+ = 1, y+ = 2, z+ = 4.
const FACES = [
    { n: [0, 0, 1], idx: [6, 7, 5, 4], cap: true },
    { n: [0, 0, -1], idx: [2, 0, 1, 3], cap: true },
    { n: [1, 0, 0], idx: [1, 5, 7, 3] },
    { n: [-1, 0, 0], idx: [0, 2, 6, 4] },
    { n: [0, 1, 0], idx: [2, 3, 7, 6] },
    { n: [0, -1, 0], idx: [0, 4, 5, 1] }
];

function buildCube(list, cell, R, pos, o) {
    const sxy = o.sxy ?? 1, sz = o.sz ?? 1, sc = o.scale ?? 1, th = o.th ?? PIECE_T;
    const corners = [];
    const cw = mv(R, [cell[0] * sc * sxy, cell[1] * sc * sxy, 0]);
    let lift = 0;
    if (o.wave) lift = waveLift(pos[0] + cw[0], pos[1] + cw[1], o.t);
    for (let k = 0; k < 8; k++) {
        const lx = (cell[0] + ((k & 1) ? .5 : -.5)) * sc * sxy;
        const ly = (cell[1] + ((k & 2) ? .5 : -.5)) * sc * sxy;
        const lz = ((k & 4) ? .5 : -.5) * th * sc * sz;
        const w = add(pos, mv(R, [lx, ly, lz]));
        w[2] += lift;
        corners.push(w);
    }
    const centre = add(add(pos, cw), [0, 0, lift]);
    const qc = toView(centre);
    list.push({ corners, R, centre, depth: CAM.dist - qc[2], o });
}

function drawCube(c) {
    const eye = EYE();
    const vs = c.corners.map(toView);
    const ps = vs.map(projV);
    const o = c.o;
    const base = o.rgb;
    for (const F of FACES) {
        const nW = mv(c.R, F.n);
        const nV = mv(CAM.V, nW);
        const fc = vs[F.idx[0]].map((_, j) => (vs[F.idx[0]][j] + vs[F.idx[2]][j]) / 2);
        if (dot(nV, sub(eye, fc)) <= 0) continue;
        let col = scaleC(base, shadeF(nW) * (o.bright ?? 1));
        if (F.cap && o.flash) col = mixC(col, WHITE, o.flash);
        if (F.cap) {
            const sw = sweepAt(c.centre[0], c.centre[1], o.t);
            if (sw) col = mixC(col, WHITE, sw);
        }
        const q = F.idx.map(k => ps[k]);
        ctx.beginPath();
        ctx.moveTo(q[0].x, q[0].y);
        for (let k = 1; k < 4; k++) ctx.lineTo(q[k].x, q[k].y);
        ctx.closePath();
        ctx.globalAlpha = o.alpha ?? 1;
        ctx.fillStyle = rgba(col);
        ctx.fill();
        if (F.cap) {
            const xs = q.map(p => p.x), ys = q.map(p => p.y);
            const g = ctx.createLinearGradient(Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys));
            g.addColorStop(0, "rgba(255,255,255,0.13)");
            g.addColorStop(0.5, "rgba(255,255,255,0)");
            g.addColorStop(1, "rgba(0,0,0,0.13)");
            ctx.fillStyle = g;
            ctx.fill();
            ctx.strokeStyle = rgba(scaleC(col, 0.86), 0.9);
            ctx.lineWidth = 1;
            ctx.stroke();
            if (o.label) drawLabelOnQuad(q[0], q[1], q[3], o.label, o.labelColor, o.labelSize);
        } else {
            ctx.strokeStyle = rgba(col);
            ctx.lineWidth = 0.8;
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }
}

// Affine-map a 100x100 label space onto a projected quad (TL, TR, BL).
function drawLabelOnQuad(p0, p1, p3, text, color, size) {
    ctx.save();
    ctx.setTransform((p1.x - p0.x) / 100, (p1.y - p0.y) / 100, (p3.x - p0.x) / 100, (p3.y - p0.y) / 100, p0.x, p0.y);
    ctx.fillStyle = color;
    ctx.font = `700 ${size}px "Segoe UI", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, 50, 53);
    ctx.restore();
}

// ---------------------------------------------------------------- board
const SLAB_HS = 4.62, SLAB_R = 0.62, SLAB_T = 0.55;
function roundedOutline(hs, r, n = 7) {
    const pts = [];
    const cs = [[hs - r, hs - r, 0], [-(hs - r), hs - r, PI / 2], [-(hs - r), -(hs - r), PI], [hs - r, -(hs - r), 1.5 * PI]];
    for (const [cx, cy, a0] of cs) for (let k = 0; k <= n; k++) {
        const a = a0 + (k / n) * PI / 2;
        pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return pts;
}
const SLAB_OUT = roundedOutline(SLAB_HS, SLAB_R);
const SLAB_IN = roundedOutline(SLAB_HS - 0.09, SLAB_R - 0.09);

function slabScale(t) {
    const u = t - T.boardIn;
    if (u < 0) return 0;
    return clamp(1 - Math.exp(-u * 9) * Math.cos(u * 3.2 * TAU) * 1, 0, 1.2);
}

function drawBoard(t) {
    const s = slabScale(t);
    if (s <= 0.001) return null;
    const dz = boardDz(t);
    const top = SLAB_OUT.map(([x, y]) => [x * s, y * s, dz]);
    const bot = SLAB_OUT.map(([x, y]) => [x * s, y * s, dz - SLAB_T * s]);
    const eye = EYE();
    // sides
    const pt = top.map(proj), pb = bot.map(proj);
    for (let i = 0; i < top.length; i++) {
        const j = (i + 1) % top.length;
        const ex = top[j][0] - top[i][0], ey = top[j][1] - top[i][1];
        const nW = norm([ey, -ex, 0]);
        const nV = mv(CAM.V, nW);
        const fc = toView([(top[i][0] + top[j][0]) / 2, (top[i][1] + top[j][1]) / 2, dz - SLAB_T * s / 2]);
        if (dot(nV, sub(eye, fc)) <= 0) continue;
        const col = scaleC([44, 44, 44], shadeF(nW) * 0.85);
        ctx.beginPath();
        ctx.moveTo(pt[i].x, pt[i].y); ctx.lineTo(pt[j].x, pt[j].y); ctx.lineTo(pb[j].x, pb[j].y); ctx.lineTo(pb[i].x, pb[i].y);
        ctx.closePath();
        ctx.fillStyle = rgba(col); ctx.strokeStyle = rgba(col); ctx.lineWidth = 1;
        ctx.fill(); ctx.stroke();
    }
    // top: border ring + inner panel
    const path = pts => { ctx.beginPath(); pts.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); };
    path(pt);
    ctx.fillStyle = "#6a6a6a"; ctx.fill();
    const inner = SLAB_IN.map(([x, y]) => proj([x * s, y * s, dz + 0.001]));
    path(inner);
    const c0 = proj([-3, 3, dz]), c1 = proj([3, -3, dz]);
    const g = ctx.createLinearGradient(c0.x, c0.y, c1.x, c1.y);
    g.addColorStop(0, "#353535"); g.addColorStop(1, "#2a2a2a");
    ctx.fillStyle = g; ctx.fill();
    return { clip: inner, dz };
}

function tileState(tile, t) {
    const [x, y] = cellW(tile.cx, tile.cy);
    const r = Math.hypot(x, y + 0.3);
    const st = T.tilesIn + r * 0.075 + ((tile.cx * 7 + tile.cy * 3) % 5) * 0.012;
    const u = seg(t, st, st + 0.42);
    if (u <= 0) return null;
    const e = E.outBack(u, 2.2);
    return { z: lerp(2.6, 0, e), alpha: clamp(u * 3), st };
}

function drawTiles(t, dz) {
    const list = [];
    for (const tile of TILES) {
        const s = tileState(tile, t);
        if (!s) continue;
        const [x, y] = cellW(tile.cx, tile.cy);
        const z = dz + TILE_T / 2 + s.z + waveLift(x, y, t) * 0.6;
        const q = toView([x, y, z]);
        list.push({ tile, x, y, z, alpha: s.alpha, depth: CAM.dist - q[2] });
    }
    list.sort((a, b) => b.depth - a.depth);
    for (const L of list) {
        const h = 0.48;
        const tl = proj([L.x - h, L.y + h, L.z + TILE_T / 2]), tr = proj([L.x + h, L.y + h, L.z + TILE_T / 2]);
        const br = proj([L.x + h, L.y - h, L.z + TILE_T / 2]), bl = proj([L.x - h, L.y - h, L.z + TILE_T / 2]);
        const bl2 = proj([L.x - h, L.y - h, L.z - TILE_T / 2]), br2 = proj([L.x + h, L.y - h, L.z - TILE_T / 2]);
        ctx.globalAlpha = L.alpha;
        // front lip
        ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(br.x, br.y); ctx.lineTo(br2.x, br2.y); ctx.lineTo(bl2.x, bl2.y); ctx.closePath();
        ctx.fillStyle = "#101010"; ctx.fill();
        ctx.beginPath(); ctx.moveTo(tl.x, tl.y); ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y); ctx.closePath();
        const sw = sweepAt(L.x, L.y, t);
        ctx.fillStyle = sw ? rgba(mixC([30, 30, 30], WHITE, sw * 0.5)) : "#1e1e1e";
        ctx.fill();
        ctx.strokeStyle = "#474747"; ctx.lineWidth = 1.1; ctx.stroke();
        drawLabelOnQuad(tl, tr, bl, L.tile.label, "#ffffff", L.tile.month ? 27 : 31);
        ctx.globalAlpha = 1;
    }
}

// ---------------------------------------------------------------- date markers
function markerCells(t) {
    const kf = DATE_STEPS * E.inOutCubic(seg(t, T.rouletteA, T.rouletteB));
    const k0 = Math.floor(kf), fr = kf - k0;
    const a = dateAt(k0), b = dateAt(Math.min(DATE_STEPS, k0 + 1));
    const he = E.inOutCubic(fr);
    const lift = Math.sin(PI * fr) * 0.55;
    const dA = cellW(...dayCell(a.d)), dB = cellW(...dayCell(b.d));
    const mA = cellW(...monthCell(a.m)), mB = cellW(...monthCell(b.m));
    const mMove = a.m !== b.m;
    return {
        day: { x: lerp(dA[0], dB[0], he), y: lerp(dA[1], dB[1], he), lift, label: String(fr > .5 ? b.d : a.d) },
        month: { x: mMove ? lerp(mA[0], mB[0], he) : mA[0], y: mMove ? lerp(mA[1], mB[1], he) : mA[1], lift: mMove ? lift : 0, label: MONTHS[fr > .5 ? b.m : a.m] }
    };
}

function buildMarkers(list, t) {
    const u = t - T.markersIn;
    if (u < 0) return;
    const pop = clamp(1 - Math.exp(-u * 10) * Math.cos(u * 2.8 * TAU));
    const m = markerCells(t);
    const land = t - T.rouletteB;
    const sq = ring(land, 4.5, 8);
    for (const [key, size] of [["month", 27], ["day", 31]]) {
        const c = m[key];
        const lift = c.lift + waveLift(c.x, c.y, t);
        const zc = TILE_T + boardDz(t) + (PIECE_T / 2) * pop * (1 - 0.35 * sq) + lift;
        const flash = land > 0 ? Math.exp(-land * 6) * 0.6 : 0;
        buildCube(list, [0, 0], rz(0), [c.x, c.y, zc], {
            rgb: YRGB, th: PIECE_T, sz: pop * (1 - 0.35 * sq), sxy: 0.98 + 0.07 * sq, t, flash,
            label: c.label, labelColor: "rgba(0,0,0,0.87)", labelSize: size
        });
    }
}

// ---------------------------------------------------------------- shadows
function drawShadows(t, clipPts) {
    if (!clipPts) return;
    ctx.save();
    ctx.beginPath(); clipPts.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath();
    ctx.clip();
    for (const id in PIECES) {
        const st = pieceState(+id, t);
        if (!st) continue;
        const h = Math.max(0, st.pos[2] - REST_Z);
        const a = 0.55 * clamp(1 - h / 7);
        if (a <= 0.01) continue;
        const off = [-LIGHT[0] / LIGHT[2] * (h + 0.35), -LIGHT[1] / LIGHT[2] * (h + 0.35)];
        ctx.filter = `blur(${(3 + h * 7).toFixed(1)}px)`;
        ctx.beginPath();
        for (const cell of PIECES[id].local) {
            const pts = [[-.5, -.5], [.5, -.5], [.5, .5], [-.5, .5]].map(([dx, dy]) => {
                const w = add(st.pos, mv(st.R, [(cell[0] + dx) * (st.scale ?? 1), (cell[1] + dy) * (st.scale ?? 1), 0]));
                return proj([w[0] + off[0], w[1] + off[1], TILE_T + boardDz(t)]);
            });
            pts.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
            ctx.closePath();
        }
        ctx.fillStyle = `rgba(0,0,0,${a.toFixed(3)})`;
        ctx.fill("nonzero");
        ctx.filter = "none";
    }
    ctx.restore();
}

// ---------------------------------------------------------------- landing FX
function drawImpacts(t) {
    const events = Object.keys(LAND).map(id => ({ t0: LAND[id], c: PIECES[id].target, rgb: PRGB[id], r: 2.6, id: +id }));
    const m = { t0: T.rouletteB, rgb: YRGB, r: 3.4 };
    const mc = cellW(...monthCell(DATE.month)), dc = cellW(...dayCell(DATE.day));
    events.push({ ...m, c: [mc[0], mc[1]] }, { ...m, c: [dc[0], dc[1]] });
    for (const ev of events) {
        const u = seg(t, ev.t0, ev.t0 + 0.6);
        if (u <= 0 || u >= 1) continue;
        const r = 0.6 + ev.r * E.outCubic(u);
        ctx.beginPath();
        for (let k = 0; k <= 48; k++) {
            const a = k / 48 * TAU;
            const p = proj([ev.c[0] + Math.cos(a) * r, ev.c[1] + Math.sin(a) * r, TILE_T + 0.02]);
            k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
        }
        ctx.strokeStyle = rgba(mixC(ev.rgb, WHITE, 0.35), 0.75 * (1 - u));
        ctx.lineWidth = 1 + 5 * (1 - u);
        ctx.stroke();
    }
}

function drawSparks(t) {
    for (const id in LAND) {
        const t0 = LAND[id];
        const u = seg(t, t0, t0 + 0.5);
        if (u <= 0 || u >= 1) continue;
        const rnd = mulberry32(+id * 977);
        const P = PIECES[id];
        for (let k = 0; k < 16; k++) {
            const a = (k / 16) * TAU + rnd() * 0.4;
            const dist = (1.4 + rnd() * 1.8) * E.outCubic(u);
            const z = TILE_T + Math.sin(PI * Math.min(1, u * 1.2)) * (0.5 + rnd() * 0.9);
            const p = proj([P.target[0] + Math.cos(a) * (1 + dist), P.target[1] + Math.sin(a) * (1 + dist), z]);
            const s = CAM.f / p.d * 0.13 * (1 - u);
            ctx.fillStyle = rgba(mixC(P.rgb, WHITE, 0.3), 1 - u * u);
            ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        }
    }
}

// ---------------------------------------------------------------- background
const rndG = mulberry32(7);
const GRAIN = document.createElement("canvas");
GRAIN.width = GRAIN.height = 256;
{
    const g = GRAIN.getContext("2d"), d = g.createImageData(256, 256);
    for (let i = 0; i < d.data.length; i += 4) {

function drawBackground(t) {
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.5, W * 0.75);
    g.addColorStop(0, "#232323"); g.addColorStop(0.55, "#161616"); g.addColorStop(1, "#090909");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

        { id: 1, x: 0.85 + 0.04 * Math.cos(t * 0.35), y: 0.3 + 0.05 * Math.sin(t * 0.45), r: 0.5 },
        { id: 8, x: 0.7 + 0.06 * Math.sin(t * 0.3 + 1), y: 0.85, r: 0.55 },

    const yb = clamp(seg(t, 3.4, 3.8)) * (1 - seg(t, 5.2, 6.2)) + Math.exp(-Math.max(0, t - T.rouletteB) * 3) * (t > T.rouletteB ? 0.6 : 0);
    for (const gl of glows) {

        ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
        const st = ctx.createLinearGradient(0, 0, W, 0);
        st.addColorStop(0, "rgba(120,160,255,0)"); st.addColorStop(0.5, `rgba(200,220,255,${0.8 * fl})`); st.addColorStop(1, "rgba(120,160,255,0)");
        ctx.fillStyle = st; ctx.fillRect(0, p.y - 2 - 6 * fl, W, 4 + 12 * fl);
    }

    if (solvedGlow > 0) {

}

function drawGrid(t) {
    const Z = -2.4, N = 26, STEP = 2;
    ctx.lineWidth = 1;
    for (let dir = 0; dir < 2; dir++) {
        for (let i = -N; i <= N; i++) {
            let prev = null;
            for (let j = -N; j <= N; j += STEP) {
                const p3 = dir ? [i, j, Z] : [j, i, Z];
                const q = toView(p3);
                const d = CAM.dist - q[2];
                const cur = d > 2 ? projV(q) : null;
                if (prev && cur) {
                    const r = Math.hypot(p3[0], p3[1]);
                    const a = 0.075 * clamp(1 - r / N) * (i % 4 === 0 ? 1.6 : 1);
                    ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
                    ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(cur.x, cur.y); ctx.stroke();
                }
                prev = cur;
            }
        }
    }
}

// ---------------------------------------------------------------- typography
const FONT = "Bahnschrift";
function setFont(size, weight = 700, stretch = "normal") {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.fontStretch = stretch;
}

const STATEMENTS = [
    { num: "8", word: "PIECES", tin: 0.42, tout: 1.9 },
    { num: "1", word: "BOARD", tin: 2.02, tout: 3.36 },
    { num: "366", word: "DAYS", tin: 3.5, tout: 4.98 }
];
function drawStatements(t) {
    const size = 150, y = 205, lineH = size * 1.05;
    for (const s of STATEMENTS) {
        if (t < s.tin || t > s.tout + 0.7) continue;
        setFont(size, 700, "condensed");
        ctx.letterSpacing = "4px";
        const chars = [...`${s.num} ${s.word}`];
        const widths = chars.map(ch => ctx.measureText(ch).width + 4);
        const total = widths.reduce((a, b) => a + b, 0);
        let x = W / 2 - total / 2;
        ctx.save();
        ctx.beginPath(); ctx.rect(0, y - size * 0.85, W, lineH); ctx.clip();
        chars.forEach((ch, i) => {
            const pin = E.outExpo(seg(t, s.tin + i * 0.028, s.tin + i * 0.028 + 0.55));
            const pout = E.inExpo(seg(t, s.tout + i * 0.018, s.tout + i * 0.018 + 0.32));
            const dy = (1 - pin) * lineH - pout * lineH;
            const isNum = i < s.num.length;
            ctx.save();
            ctx.translate(x + widths[i] / 2, y + dy);
            ctx.rotate((1 - pin) * 0.25);
            ctx.fillStyle = isNum ? YEL : "#ffffff";
            ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
            if (isNum) { ctx.shadowColor = "rgba(255,235,59,0.45)"; ctx.shadowBlur = 30; }
            ctx.fillText(ch, 0, 0);
            ctx.restore();
            x += widths[i];
        });
        ctx.restore();
        // underline wipe
        const ul = E.outExpo(seg(t, s.tin + 0.15, s.tin + 0.7)) - E.inExpo(seg(t, s.tout, s.tout + 0.35));
        const ulx = W / 2 - total / 2;
        if (ul > 0) {
            const from = t < s.tout ? ulx : ulx + total * (1 - ul);
            ctx.fillStyle = "rgba(255,255,255,0.18)";
            ctx.fillRect(from, y + 26, total * ul, 3);
        }
        ctx.letterSpacing = "0px";
    }
}

const KWORDS = [
    { text: "ROTATE", dot: 1, tin: 5.45, kind: "rotate", y: 470 },
    { text: "FLIP", dot: 4, tin: 6.45, kind: "flip", y: 590 },

];
function drawKineticWords(t) {
    const x0 = 130, size = 120, tout = 9.3;

        ctx.fillRect(-ds / 2, -ds / 2, ds, ds);

    });

        ctx.fillText(`TODAY'S PUZZLE  ·  ${MONTHS[DATE.month]} ${DATE.day}`, 134 - (1 - cu) * 40, 350);

function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawProgressBar(t) {
    const inU = E.outExpo(seg(t, 5.1, 5.6)), outU = E.inExpo(seg(t, 10.0, 10.4));
    if (inU <= 0 || outU >= 1) return;
    const bw = 560, bh = 26, x = W / 2 + 190 - bw / 2, y = H - 92 + (1 - inU) * 60 + outU * 120;
    ctx.save();
    ctx.globalAlpha = inU * (1 - outU);
    roundRect(x, y, bw, bh, bh / 2);
    ctx.fillStyle = "#2f2f2f"; ctx.fill();
    ctx.save(); ctx.clip();
    let n = 0;
    T.solveOrder.forEach((id, k) => {
        const g = seg(t, LAND[id], LAND[id] + 0.15);
        if (g <= 0) return;
        n = k + 1;
        const sx = x + (bw / 8) * k, w = (bw / 8) * g;
        ctx.fillStyle = PC[id]; ctx.fillRect(sx, y, w, bh);
        const gr = ctx.createLinearGradient(sx, y, sx + bw / 8, y + bh);
        gr.addColorStop(0, "rgba(255,255,255,0.12)"); gr.addColorStop(.5, "rgba(255,255,255,0)"); gr.addColorStop(1, "rgba(0,0,0,0.12)");
        ctx.fillStyle = gr; ctx.fillRect(sx, y, w, bh);
        ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(sx + w - 1, y, 1, bh);
        const fl = Math.exp(-(t - LAND[id]) * 6);
        ctx.fillStyle = `rgba(255,255,255,${0.5 * fl})`; ctx.fillRect(sx, y, w, bh);
    });
    ctx.restore();
    // completion glow
    const cg = t > T.solved ? Math.exp(-(t - T.solved) * 2.5) : 0;
    if (cg > 0) {
        ctx.shadowColor = "rgba(255,255,255,0.9)"; ctx.shadowBlur = 40 * cg;
        roundRect(x, y, bw, bh, bh / 2); ctx.strokeStyle = `rgba(255,255,255,${0.8 * cg})`; ctx.lineWidth = 2; ctx.stroke();
        ctx.shadowBlur = 0;

    if (inGroove || (inOutro && (b % 2 === 1))) put(t, kick(0.95), 0.72, 0, 0.02);
    if (t >= 4.0 && t < 8.5 && (b % 2 === 1)) put(t, clap(), 0.32, 0.1, 0.3);

    }
    if (inOutro && b % 2 === 0) put(t + 0.25, hat(35), 0.12, 0.3, 0.1);
    // bass: 8th-note pulse on the chord root, ducked after each kick
    if (t >= 2.0 && t < 14.5 && !(t >= 8.5 && t < 9.5)) {
        for (const off of [0, 0.25]) {
            const root = chordAt(t + off)[0] - 12, f = mtof(root);
            const bb = len(0.24);
            for (let i = 0; i < bb.length; i++) {
                const tt = i / SR;
                bb[i] = (Math.sin(TAU * f * tt) + 0.35 * Math.sin(TAU * 2 * f * tt)) * Math.min(1, tt * 200) * Math.exp(-tt * 5) * Math.min(1, (bb.length - i) / 200);
            }
            put(t + off, bb, off ? 0.34 : 0.22, 0, 0);
        }
    }
}

// Riser into the solve.
{
    const dur = 1.5, b = len(dur);

    for (let i = 0; i < b.length; i++) {
        const u = i / b.length;

// Opening hit on frame 0.
put(0.0, thud(170, 36, 1.6), 1.1, 0, 0.35);

// ------------------------------------------------------------------ SFX from the cue sheet
const PENTA = [72, 74, 76, 79, 81, 84, 86, 88];          // C major pentatonic, rising per piece
const LETTER = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81, 84, 86, 88, 91];
for (const e of EVENTS) {
    switch (e.type) {
        case "whoosh": put(e.t, whoosh(e.len ?? 0.5), e.len > 0.52 ? 0.3 : 0.55, clampPan(e.pan), 0.2); break;
        case "tick": put(e.t, click(1800 + e.n * 160, 0.04), 0.6, clampPan(e.pan), 0.25); break;
        case "slam": put(e.t, thud(140, 38, 1.2), 1.0, 0, 0.3); put(e.t, crash(1.2), 0.12, 0, 0.4); break;
        case "tile": put(e.t, click(2600 + rnd() * 1400, 0.02), 0.07, rnd() * 1.2 - 0.6, 0.3); break;
        case "pop": put(e.t, blip(mtof(76), 0.4), 0.8, -0.2, 0.3); put(e.t + 0.06, blip(mtof(81), 0.4), 0.6, 0.2, 0.3); break;
        case "hop": put(e.t, click(3100, 0.018), 0.16, 0, 0.1); break;
        case "impact":
            put(e.t, thud(110, 40, 1.0), 0.9, 0, 0.3);

            break;
        case "land":
            put(e.t, clack(), 0.6, clampPan(e.pan), 0.2);

            put(e.t, crash(3.0), 0.3, 0, 0.5);
            [72, 76, 79, 84, 88, 91, 96].forEach((m, i) => put(e.t + i * 0.055, bell(mtof(m), 2.0), 0.13, (i % 2 ? 0.4 : -0.4), 0.6));
            break;
        case "letter": put(e.t, blip(mtof(LETTER[e.n % LETTER.length]), 0.5), 0.3, (e.n % 8) / 8 - 0.45, 0.4); break;
        case "cta": put(e.t, bell(mtof(84), 2.4), 0.2, 0, 0.6); put(e.t + 0.12, bell(mtof(91), 2.4), 0.14, 0, 0.6); break;
    }
}
function clampPan(p) { return Math.max(-0.8, Math.min(0.8, p ?? 0)); }

// ------------------------------------------------------------------ reverb (Schroeder) + master
function reverb(inp, combs, aps) {
    const outb = new Float32Array(N);
    for (const [d, fb] of combs) {
        const buf = new Float32Array(d); let k = 0, lp = 0;
        for (let i = 0; i < N; i++) {
            const y = buf[k]; lp = y * 0.7 + lp * 0.3;
            buf[k] = inp[i] + lp * fb; k = (k + 1) % d; outb[i] += y * 0.25;
        }
    }
    for (const [d, g] of aps) {
        const buf = new Float32Array(d); let k = 0;
        for (let i = 0; i < N; i++) {
            const bv = buf[k], y = -g * outb[i] + bv;
            buf[k] = outb[i] + g * y; k = (k + 1) % d; outb[i] = y;
        }
    }
    return outb;
}
const wetL = reverb(RevL, [[1557, 0.84], [1617, 0.84], [1491, 0.84], [1422, 0.84]], [[225, 0.5], [556, 0.5]]);
const wetR = reverb(RevR, [[1580, 0.84], [1640, 0.84], [1514, 0.84], [1445, 0.84]], [[248, 0.5], [579, 0.5]]);

let peak = 0;

const drive = 1.25 / Math.max(0.5, peak);
const view = new DataView(new ArrayBuffer(44 + N * 4));
const str = (o, s) => { for (let k = 0; k < s.length; k++) view.setUint8(o + k, s.charCodeAt(k)); };
str(0, "RIFF"); view.setUint32(4, 36 + N * 4, true); str(8, "WAVE");
str(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 2, true);
view.setUint32(24, SR, true); view.setUint32(28, SR * 4, true); view.setUint16(32, 4, true); view.setUint16(34, 16, true);
str(36, "data"); view.setUint32(40, N * 4, true);
for (let i = 0; i < N; i++) {
    const fade = Math.min(1, i / (SR * 0.01), (N - i) / (SR * 0.25));
    const l = Math.tanh(L[i] * drive) * 0.89 * fade, r = Math.tanh(R[i] * drive) * 0.89 * fade;
    view.setInt16(44 + i * 4, Math.round(l * 32767), true);
    view.setInt16(44 + i * 4 + 2, Math.round(r * 32767), true);
}

for (let k = 0; k < bytes.length; k += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(k, k + 0x8000));
